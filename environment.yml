name: archimedes
channels:
  - conda-forge
dependencies:
  # Core toolchain
  - python=3.12
  - pip
  - uv          # Modern, fast Python package + tool installer (used for arc-canteen and dev tooling)
  - git
  - nodejs>=22  # Frontend toolchain (npm, npx). Required for `npm run lint`,
                # `npm run dev`, `npm run build` in ui/. Without this, devs
                # have to install Node separately and CI-vs-local parity
                # breaks (the ESLint gate runs in CI only).

  # Infra / cloud CLI tooling — conda-forge binaries, pinned so the whole team
  # (and a from-scratch setup) gets one consistent version for IaC + AWS work.
  - terraform>=1.10   # IaC for the AWS stack (infra/*.tf). >=1.10 required for S3-native
                      #   state locking (use_lockfile=true; see infra/README.md). Verified 1.15.3.
  - awscli>=2.15      # AWS CLI v2 (conda-forge ships v2). v2 is REQUIRED for `aws configure sso`
                      #   / IAM Identity Center — v1's SSO support is insufficient. Verified 2.34.48.
  # NOTE: aws-sam-cli is intentionally NOT here — it is not packaged on conda-forge.
  #   Install via Homebrew (`brew install aws-sam-cli`). See infra/README.md
  #   "Local CLI tooling" for when SAM actually applies (Lambda/serverless only).

  # Python deps installed via pip — pinned loosely; tighten in pyproject.toml as the project firms up.
  - pip:
      # --- Web backend ---
      - fastapi>=0.115
      - "starlette>=1.3.1"            # Pinned directly to close PYSEC-2026-161 (Host-header validation bypass); FastAPI's range can resolve to vulnerable 1.0.0 without this floor. Floor raised to 1.3.1 to close CVE-2026-54282 / CVE-2026-54283 (CVE bump 2026-06-25); FastAPI's requires-dist is starlette>=0.46.0 with no upper bound, so this resolves cleanly.
      - "uvicorn[standard]>=0.49.0"
      - sqlalchemy>=2.0
      - alembic>=1.13                 # Schema migration tool (issue #1028) — replaces the hand-rolled idempotent ADD-COLUMN patches in db.py. MIT license, maintained by the SQLAlchemy project. Aligned with backend/requirements.txt.
      - psycopg2-binary>=2.9.12       # PostgreSQL driver (binary wheel; no system pq needed). Floor aligned with backend/requirements.txt via dependabot PR #247.
      - redis>=8.0.0                  # Redis client for live regime/state cache (aligned with backend/requirements.txt)
      - pydantic>=2.13.4
      - pydantic-settings>=2.14.2     # Floor aligned with backend/requirements.txt (dependabot batch 2026-07-13).
      - python-dotenv>=1.2.2
      - "slowapi>=0.1.10"             # FastAPI rate-limiter — required by api/limiter.py + user_routes.py. CI installs from backend/requirements.txt; this keeps local dev parity.

      # --- Data + numerics ---
      - numpy>=2.4.6,<3.0             # numpy 2 verified against backtrader 1.9.78.123 on 2026-06-12: full analytics-engine suite (170 tests) + backend backtrader tests + e2e Faber SMA200 run all green. Aligned with backend/requirements.txt (dependabot #489).
      - pandas>=2.2
      - scipy>=1.13
      - scikit-learn>=1.9.0          # GaussianMixture + StandardScaler for the GmmRegimeDetector (issue #661); BSD-3-Clause. Aligned with backend/requirements.txt (dependabot batch 2026-07-13).
      - matplotlib>=3.8
      - seaborn>=0.13

      # --- Market data ---
      - yfinance>=1.4.1              # Historical + live equity/ETF/crypto data; for backtesting
      - requests>=2.32,<2.34          # arxiv pins requests<2.34; keep aligned with backend/requirements.txt (Dependabot #702 broke the deploy 2026-06-25)
      - aiohttp>=3.14.1                # Bumped from 3.13.5 to close CVE-2026-34993 / CVE-2026-47265 (HTTP parser DoS/smuggling). Floor aligned with backend/requirements.txt.
      - httpx>=0.27                   # Directly imported by services/corpus_service.py (arXiv intake) and services/llm_backend.py (OpenAI-compatible + Ollama). Pinned so we don't rely on transitive resolution.
      - urllib3>=2.7.0                # Transitive (requests / boto3 / arxiv). Pinned directly to close PYSEC-2026-141 / PYSEC-2026-142 so a fresh resolve can't regress (CVE bump 2026-06-25). Aligned with backend/requirements.txt.

      # --- Backtesting (per backtrader-vs-vectorbt decision memo) ---
      - backtrader>=1.9.78.123        # Decision: v1 default. See docs/specs/backtrader-vs-vectorbt-decision-memo.md. Floor aligned with backend/requirements.txt via dependabot PR #249.

      # --- x402 micropayments / Circle marketplace ---
      # circle-titanoboa-sdk provides circlekit — imported by marketplace_routes.py,
      # wallet_provisioner.py, and settlement.py. Pinned to the same commit as
      # backend/requirements.txt; pinned to a forked commit (not on PyPI) so the
      # git URL form is required. Evaluate vendoring if the upstream fork disappears.
      # pip-audit flags PYSEC-2023-142 / PYSEC-2025-33 against the transitive vyper
      # pull-in (via titanoboa) — both false positives against our resolved 0.4.3
      # (fixed upstream in 0.3.1 / 0.4.1 respectively; also moot since we never
      # compile untrusted Vyper source). Full analysis: backend/requirements.txt
      # comment above the same pin (investigated 2026-07-14).
      - "circle-titanoboa-sdk[x402,wallets] @ git+https://github.com/vyperlang/circle-titanoboa-sdk.git@09828f399731dd3250fb402f7f511046fb202355"

      # --- LLM ---
      - anthropic>=0.104.1            # Claude / GLM-compatible client for strategy extraction + reasoning trace generation + chat. Floor aligned with backend/requirements.txt via dependabot PR #251; locally smoke-tested at 0.104.1 against llm_backend.py + chat_service.py (full 784-test backend suite green).

      # --- On-chain / Web3 ---
      # Floors kept in lockstep with backend/requirements.txt (audit 2026-06-14):
      # the two had drifted (web3 7.0 vs 7.16.0, eth-utils 5.0 vs 6.0.0), which is
      # the documented #1 cause of "works locally, breaks in CI". eth-utils 5→6
      # was an API-breaking bump, so the floors must agree.
      - web3>=7.16.0                  # Python EVM client; works with Arc (EVM-compatible)
      - eth-account>=0.13.7           # Local key management for testnet wallets
      - eth-abi>=5.2.0,<6             # ABI codec (direct import in marketplace/encoding.py). Cap <6: eth-account's pre-release specifier (`eth-abi>=4.0.0-b.2`) otherwise lets pip resolve the 6.0.0b1 beta — no betas on the funds path. Aligned with backend/requirements.txt.
      - eth-utils>=6.0.0
      - cryptography>=42.0            # RSA sign/serialize for the oracle signer (backend/archimedes/chain/oracle_updater.py); mirrors backend/requirements.txt

      # --- AWS / S3 ---
      - boto3>=1.43.46                 # S3 artifact reads for KB pipeline output (embeddings, KG). Aligned with backend/requirements.txt (dependabot batch 2026-07-13).

      # --- Paper ingestion (Q-fin corpus) ---
      - arxiv>=2.1                    # arxiv API client
      - pypdf>=6.14.2                 # PDF text extraction. Floor 6.13.3 closed 8 CVEs incl GHSA-jm82-fx9c-mx94 (CVE bump 2026-06-25). Aligned with backend/requirements.txt (dependabot batch 2026-07-13).

      # --- Semantic retrieval (paper_rag MiniLM embeddings, issue #874) ---
      - torch>=2.13.0,<3.0             # PyTorch CPU (local dev: pip picks the native/MPS wheel; Docker uses the CPU-only wheel via --extra-index-url in requirements.txt). Floor aligned with backend/requirements.txt via dependabot PR #1163.
      - sentence-transformers>=2.7    # all-MiniLM-L6-v2 zero-cost semantic retrieval for paper_rag.py; aligned with backend/requirements.txt

      # --- Quality + tests ---
      - ruff>=0.6                     # Linter + formatter; configured at line length 120
      - pytest>=8.3
      - pytest-asyncio>=0.24
      - pytest-cov>=5.0
      - "fakeredis[lua]>=2.26.0"         # Test double for Redis in marketplace unit tests (test_state.py); dev-only, not in prod requirements.txt
      - mypy>=1.11
      - "pip-audit>=2.7"              # Supply-chain CVE scanner — run `pip-audit` to check installed deps against the PyPI vulnerability DB. Not yet a CI gate; advisory only.

      # --- Dev convenience ---
      - ipython>=8.27
      - jupyter>=1.1                  # For exploratory strategy work
      - tornado>=6.5.7                # Pinned directly to close CVE-2026-49854 (WebSocket frame-length overflow) in jupyter's transitive tornado dep; floor raised to 6.5.7 (CVE bump 2026-06-25). environment.yml-only: tornado is a dev/notebook dependency, not imported by backend runtime code (not in backend/requirements.txt).
