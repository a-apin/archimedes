# Archimedes docs site — mkdocs-material config for issue #1381 (option B:
# GitHub Pages). Builds the existing docs/ tree plus the agent-generated
# openwiki/ tree as-is; no content was moved or rewritten to make this file.
# See docs/runbooks/docs-site-setup.md for the three manual console/DNS steps
# the *deploy* needs to go live, and .github/workflows/docs-site.yml for the
# jobs — the build runs on every docs-path push and PR, the deploy stays
# gated on the DOCS_SITE_ENABLED repo variable until those steps are done.

site_name: Archimedes
site_url: https://docs.archimedes-arc.com
repo_url: https://github.com/a-apin/archimedes
repo_name: a-apin/archimedes
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition

# Build hooks — see the module docstring for the full reasoning.
#   1. mounts the agent-generated openwiki/ tree (it lives outside docs_dir,
#      so mkdocs cannot see it on its own);
#   2. rewrites, at build time only, the relative links that point out of
#      docs_dir (../CLAUDE.md, backend/..., contracts/...) to GitHub blob
#      URLs. Those links are correct on GitHub and are already gated there by
#      docs-gate.yml's docs_links.py; they simply cannot resolve inside a site
#      rooted at docs/. Committed markdown is never modified.
hooks:
  - .github/scripts/mkdocs_hooks.py

# `mkdocs serve` watches docs_dir and this file and nothing else, so an edit
# under openwiki/ would not live-reload without this. (The hook itself is
# loaded once per process — mkdocs lru_caches it — so editing that file still
# needs a restart, not just a rebuild.)
watch:
  - openwiki

# `mkdocs build --strict` is now the build command (here and in
# .github/workflows/docs-site.yml), and it is clean. It was previously
# rejected because ~300 WARNINGs were produced by correct out-of-docs_dir
# links; the hook above removes that entire class by repointing them at
# GitHub instead of at nothing, so the remaining WARNING budget is zero and
# --strict is a real gate: a link into docs/ or openwiki/ that names a file
# which does not exist now fails the build. The hook deliberately does NOT
# rewrite that case — see docs/runbooks/docs-site-setup.md
# § "mkdocs --strict is the gate".

