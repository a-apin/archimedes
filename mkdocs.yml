# Archimedes docs site — mkdocs-material config for issue #1381 (option B:
# GitHub Pages). Builds the existing docs/ tree as-is; no content was moved
# or rewritten to make this file. See docs/runbooks/docs-site-setup.md for
# the two manual steps (Pages source + DNS) this needs to go live, and
# .github/workflows/docs-site.yml for the deploy job — inert until those
# steps are done.

site_name: Archimedes
site_url: https://docs.archimedes-arc.com
repo_url: https://github.com/a-apin/archimedes
repo_name: a-apin/archimedes
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition

# `mkdocs build` here deliberately means non-strict (no `--strict`), in this
# file and in .github/workflows/docs-site.yml. mkdocs's own (default)
# validation settings already do the useful thing: WARNING-level output for
# every link/nav target it can't resolve, without failing the build.
# `--strict` was evaluated and rejected — see
# docs/runbooks/docs-site-setup.md § "mkdocs --strict findings" for the full
# count and categorization of the ~300 warnings it produces (in short: docs
# in this repo correctly link out of docs_dir to source files and to
# ../CLAUDE.md etc. per the repo's own "every claim is a link to a file"
# convention — those links are outside mkdocs's docs_dir and can't resolve
# in the built site, but they're not broken, they're doing their job on
# GitHub, which is where this repo's own docs-gate.yml link checker
# already validates them). Re-run that check if the count changes a lot.

