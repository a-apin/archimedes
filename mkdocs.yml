  # Agent-generated wiki — the openwiki/ tree (#1597), which lives OUTSIDE
  # docs_dir and is mounted into the build by .github/scripts/mkdocs_hooks.py.
  # Kept as its own top-level section, never mixed into the hand-written
  # sections above, because the provenance is the point: every page here was
  # written by an agent from docs/quant/ and published without line-by-line
  # human review. agent-wiki.md is the section index and carries that note;
  # the hook stamps the same warning on each page.
  #
  # These entries are listed by hand on purpose. Generating them would mean a
  # regenerated wiki publishes new agent-written pages with no person in the
  # loop; instead backend/tests/test_docs_site.py fails when an
  # openwiki/**.md has no entry here, so admitting a new page is a deliberate
  # act. Add the row in the same PR that adds the page.
  - Agent-generated wiki:
      - agent-wiki.md
      - openwiki/quickstart.md
      - openwiki/index.md
      - openwiki/INSTRUCTIONS.md
      - Rigor:
          - openwiki/rigor/index.md
